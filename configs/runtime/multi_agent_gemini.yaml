max_sessions: 20
max_counselor_turns: 45
end_token: "</end>"
concurrency: 1
resume: true
overwrite: false
random_seed: 7
output_language: English

# Client simulator backend
client_backend: openai_api
client_model: gemini-3-flash-preview
client_base_url: https://generativelanguage.googleapis.com/v1beta/openai/
client_api_key_env: GEMINI_API_KEY
client_timeout_sec: 120
client_max_retries: 16
client_retry_sleep_sec: 1.0
client_max_tokens: 512
client_temperature: 0.7

# PsychAgent session controls
psychagent_max_turns: 45
psychagent_max_retries: 16
psychagent_retry_sleep_sec: 1.0
psychagent_counselor_system_filename: system.jinja2

# Skill retrieval assets
psychagent_skill_base_dir: assets/skills/sect
psychagent_skill_select_prompt_dir: prompts/psychagent/skill/select_skill
psychagent_skill_rewrite_prompt_dir: prompts/psychagent/skill/rewrite
psychagent_skill_sects: all

# Gemini Embedding API (native SDK). Regenerated vectors live in a separate
# provenance-keyed store (micro_skills.<model>.<dims>.pt); the original
# artifacts are never overwritten. See scripts/migrate_skill_embeddings.py.
psychagent_embedding_provider: gemini
psychagent_embedding_base_url: https://generativelanguage.googleapis.com/v1beta
psychagent_embedding_api_key_env: GEMINI_API_KEY
psychagent_embedding_model: gemini-embedding-001
psychagent_embedding_dimensions: 768
psychagent_embedding_batch_size: 4
psychagent_embedding_max_retries: 5
psychagent_embedding_retry_sleep_sec: 10.0
psychagent_embedding_timeout_sec: 60
psychagent_embedding_verify_ssl: true

# Multi-Agent Pipeline ablation flags
multi_agent_enabled: true
uncertainty_enabled: true
risk_enabled: true
clarification_enabled: true
safety_supervisor_enabled: true
longitudinal_enabled: true
multi_agent_routing_enabled: true
